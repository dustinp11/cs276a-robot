/**:
  ros__parameters:
    # select fast; safe remains an unimplemented skeleton
    navigation:
      mode: fast
      # follow the plan; refine the final approach from wall tag 3
      feedback_required: false
      # options: at_goal, near_goal, throughout, off
      visual_feedback: near_goal
      goal_reference_family: 36h11
      goal_reference_id: 3
      goal_feedback_wait_s: 6.0
      tag_search_enabled: false
      visual_enable_distance_m: 0.30
      goal_max_step_m: 0.08
      goal_step_fraction: 0.5
      grid_resolution_m: 0.05
      planning_buffer_m: 0.05
      drive_duration_s: 1.0
      turn_feedback_timeout_s: 0.35
      turn_timeout_s: 8.0
      position_tolerance_m: 0.08
      # avoid chasing centimeter noise with fixed-speed motors
      goal_tolerance_m: 0.05
      goal_refine_radius_m: 0.20
      goal_max_correction_m: 0.12
      checkpoint_window_s: 2.0
      checkpoint_max_correction_m: 1.0
      checkpoint_max_heading_rad: 1.5707963267948966
      max_checkpoint_corrections: 12
      recovery_min_clearance_m: 0.03
      heading_tolerance_rad: 0.12
      settle_s: 1.0
      feedback_wait_s: 8.0
      search_timeout_s: 20.0
      search_observation_wait_s: 3.0
      pose_timeout_s: 1.0
      stable_samples: 3
      stable_position_spread_m: 0.06
      stable_heading_spread_rad: 0.10
      max_position_jump_m: 0.35
      max_heading_jump_rad: 0.6283185307179586
      max_turns: 30
      mission_timeout_s: 240.0

    # reuse the hw3 optical-to-base mount
    # offsets must refer to footprint center
    camera_mount:
      x_m: 0.0
      y_m: 0.0
      z_m: 0.2
      roll_deg: 0.0
      pitch_deg: 0.0
      yaw_deg: 0.0

    # retain conservative gates for run one
    localization:
      min_decision_margin: 20.0
      max_hamming: 1
      max_tag_distance_m: 5.0
      max_height_error_m: 0.20
      max_tilt_deg: 20.0
      # tolerate observed wall bias but reject large outliers
      min_inlier_tags: 2
      outlier_position_m: 0.20
      outlier_heading_rad: 0.3490658503988659
