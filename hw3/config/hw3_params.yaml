/**:
  ros__parameters:
    # Frame identifiers
    robot_frame: "base_link"
    camera_frame: "camera_frame"
    map_frame: "map"

    # Camera extrinsics on robot base (matching HW2 robot configuration)
    # Optical frame: X right, Y down, Z forward
    # Body frame: X forward, Y left, Z up
    camera_mount:
      x_m: 0.0
      y_m: 0.0
      z_m: 0.2
      roll_deg: 0.0
      pitch_deg: 0.0
      yaw_deg: 0.0

    # AprilTag detection quality thresholds
    quality:
      min_decision_margin: 20.0
      max_hamming: 1
      max_tag_distance_m: 5.0
      min_tag_distance_m: 0.1
      max_height_error_m: 0.25
      max_tilt_deg: 35.0

    # Visual Odometry settings
    visual_odometry:
      min_common_tags: 1             # At least 1 common tag required for relative motion
      max_dt_s: 1.5                  # Maximum allowable time between consecutive frames for VO
      max_trans_disagreement_m: 0.35 # Outlier rejection threshold for inter-tag agreement
      max_rot_disagreement_deg: 25.0 # Outlier rejection threshold for inter-tag agreement
      base_trans_noise_m: 0.02       # Base translation uncertainty per observation (1-sigma)
      base_rot_noise_rad: 0.03       # Base rotation uncertainty per observation (1-sigma)

    # EKF-SLAM settings
    ekf_slam:
      # Motion prediction source: 'visual_odometry' (preferred) or 'cmd_vel' (fallback)
      motion_prediction_source: "visual_odometry"
      use_cmd_vel_fallback: true
      cmd_vel_timeout_s: 0.5

      # Initial robot pose covariance (x, y, theta)
      initial_covariance:
        sigma_x_m: 0.001
        sigma_y_m: 0.001
        sigma_theta_rad: 0.001

      # Motion model process noise
      process_noise:
        # For visual odometry input
        vo_sigma_x_m: 0.03
        vo_sigma_y_m: 0.03
        vo_sigma_theta_rad: 0.04
        # For commanded velocity input (higher uncertainty due to motor inconsistency)
        cmd_sigma_v_mps: 0.15
        cmd_sigma_lat_mps: 0.05
        cmd_sigma_omega_radps: 0.25

      # Measurement noise (range and bearing)
      measurement_noise:
        sigma_range_m: 0.05
        sigma_bearing_rad: 0.05
        # Noise distance scaling factor (uncertainty scales as 1 + (dist/dist_ref)^2)
        range_scale_dist_m: 2.0

      # Outlier rejection (Chi-squared 2-DOF gate)
      mahalanobis_gate: 50.0

      # Measurement update mode:
      # 'all': update all visible mapped tags
      # 'independent_only': update only tags not solely used for inter-frame VO prediction
      update_mode: "all"

    # Visualization and Logging
    visualization:
      publish_tf: true
      trajectory_history_len: 2000
      marker_scale_m: 0.15
      ellipse_sigma_scale: 2.0  # 2-sigma (95%) confidence ellipse

    # Recording settings
    recording:
      default_output_dir: "hw3_results"
      auto_export_csv: true

    # Closed-Loop Square Navigation settings
    navigation:
      square_size_ft: 7.0             # Side length of the square in feet (7 ft = 2.1336 m)
      max_linear_velocity: 0.20       # Maximum linear speed (m/s, conservative from HW2)
      min_linear_velocity: 0.05       # Minimum linear speed to overcome motor deadzone (m/s)
      angular_velocity_ccw: 1.77      # Calibrated CCW angular speed (rad/s, 360 deg in 3.55s with [-0.43, 0.43])
      angular_velocity_cw: 1.75       # Calibrated CW angular speed (rad/s, 360 deg in 3.59s with [0.4, -0.4])
      max_angular_velocity: 1.77      # Maximum angular turn speed (rad/s)
      min_angular_velocity: 0.20      # Minimum angular turn speed (rad/s)
      linear_kp: 0.60                 # Proportional gain on distance error
      angular_kp: 1.20                # Proportional gain on heading error
      waypoint_tolerance_m: 0.15      # Acceptance radius for arriving at a waypoint (m)
      heading_tolerance_rad: 0.10     # Heading tolerance for turn-in-place (~5.7 deg)
      heading_drive_threshold_rad: 0.45 # Heading error threshold to revert to turn-in-place (~26 deg)
      turn_step_deg: 90.0             # Option A: Single continuous 90 deg turn at corners
      turn_settle_time_s: 1.5         # Pause duration after turn for camera stabilization & tag discovery (s)
      pose_timeout_s: 0.60            # Maximum allowable age of EKF pose before halting (s)
      max_position_uncertainty_m: 0.40  # Maximum allowable robot position 1-sigma before halting (m)
      max_heading_uncertainty_rad: 0.40 # Maximum allowable robot heading 1-sigma before halting (~23 deg)
      control_frequency_hz: 10.0      # Closed-loop control loop frequency (Hz)
      auto_start: false               # Require explicit start command
      output_dir: "hw3_results"       # Telemetry output directory
      log_csv: true                   # Enable navigation_log.csv
